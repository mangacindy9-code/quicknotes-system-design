<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>QuickNotes</h1>
      <p>Manage your notes seamlessly in real time.</p>
    </header>

    <main>
      <section class="controls">
        <button id="load-btn" type="button">Load Notes</button>
      </section>

      <div id="status" role="status" aria-live="polite"></div>

      <section class="form-container">
        <h2>Create a Note</h2>
        <form id="note-form">
          <div class="form-group">
            <label for="title-input">Title (Required, max 100 characters):</label>
            <input type="text" id="title-input" maxlength="100" required placeholder="Enter note title...">
          </div>
          <div class="form-group">
            <label for="body-input">Body (Optional):</label>
            <textarea id="body-input" rows="4" placeholder="Enter note body..."></textarea>
          </div>
          <button id="submit-btn" type="submit">Create Note</button>
        </form>
      </section>

      <section class="notes-container">
        <h2>Your Notes</h2>
        <ul id="notes-list"></ul>
      </section>
    </main>
  </div>
</body>
</html>
